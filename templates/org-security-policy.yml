# Org policy wrapper — publish as your-org/security-policy, then app repos call this once.
name: Org security policy

on:
  workflow_call:
    inputs:
      profile:
        type: string
        default: standard
      fail-on-severity:
        type: string
        default: HIGH

permissions:
  contents: write
  pull-requests: write
  security-events: write
  actions: read
  id-token: write
  packages: read

jobs:
  security:
    uses: OWNER/scankit/.github/workflows/reusable-security-full.yml@b9246b836e49f952795404d85ceb8e3c65281d7d
    with:
      profile: ${{ inputs.profile }}
      selection-mode: detected
      fail-on-severity: ${{ inputs.fail-on-severity }}
      results-publish-mode: none
