# Copy into your app repo as .github/workflows/security-sbom.yml
# Replace OWNER/scankit and prefer a commit SHA instead of @main.
name: Security — sbom

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read
  id-token: write
  pull-requests: read
  packages: read

concurrency:
  group: security-sbom-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sbom:
    uses: OWNER/scankit/.github/workflows/reusable-sbom.yml@b9246b836e49f952795404d85ceb8e3c65281d7d # pin to commit SHA; bump when upgrading
    with:
      selection-mode: detected
      fail-on-severity: HIGH
      # scan-scope defaults to full for category-only entrypoints;
      # use reusable-security-full for PR diff scoping (scan-scope: auto).
      # Set enable-*: false to disable individual tools in the reusable workflow.
