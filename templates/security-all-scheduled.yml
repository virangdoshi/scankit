# Daily / on-demand full suite with results published as a PR.
# Requires contents:write and pull-requests:write (granted below).
# Replace OWNER/scankit and prefer a commit SHA instead of @main.
name: Security — scheduled

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write
  security-events: write
  actions: read
  id-token: write
  pull-requests: write
  packages: read

jobs:
  security:
    uses: OWNER/scankit/.github/workflows/reusable-security-full.yml@b9246b836e49f952795404d85ceb8e3c65281d7d # pin to commit SHA; bump when upgrading
    with:
      selection-mode: detected
      fail-on-severity: HIGH
      results-publish-mode: pull-request
      results-branch: security-results
      scan-scope: full
      # Trusted schedule context — builds OK if you need image/compile scans:
      # enable-image-build: true
      # enable-code-build: true
