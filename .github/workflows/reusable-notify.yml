name: Reusable Notify

on:
  workflow_call:
    inputs:
      webhook-url:
        type: string
        required: true
      results-path:
        type: string
        default: security-results

permissions:
  contents: read
  actions: read

jobs:
  notify:
    name: notify-webhook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: security-results-*
          merge-multiple: true
          path: artifacts
        continue-on-error: true
      - name: Post summary to webhook
        env:
          WEBHOOK: ${{ inputs.webhook-url }}
          SUMMARY: ${{ inputs.results-path }}/latest/summary.md
        run: |
          set -euo pipefail
          body="scankit scan completed. See workflow artifacts for details."
          if [[ -f "$SUMMARY" ]]; then
            body="$(head -c 8000 "$SUMMARY")"
          elif [[ -f artifacts/latest/summary.md ]]; then
            body="$(head -c 8000 artifacts/latest/summary.md)"
          fi
          payload="$(python3 -c 'import json,os,sys; print(json.dumps({"text": sys.argv[1]}))' "$body")"
          curl -sfS -X POST -H 'Content-Type: application/json' -d "$payload" "$WEBHOOK" || echo "Webhook notify failed (non-fatal)"
