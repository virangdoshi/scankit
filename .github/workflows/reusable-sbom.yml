name: Reusable SBOM

on:
  workflow_call:
    inputs:
      selection-mode:
        type: string
        default: detected
      fail-on-severity:
        type: string
        default: HIGH
      checkout-ref:
        type: string
        default: ""
      scan-scope:
        type: string
        default: full
      scope_sbom:
        type: string
        default: "true"
      has_generic_code:
        type: string
        default: "true"
      enable-syft:
        description: Anchore Syft SBOM via anchore/sbom-action (SPDX + CycloneDX)
        type: boolean
        default: true
      enable-trivy-sbom:
        type: boolean
        default: true
      enable-cdxgen:
        type: boolean
        default: true
      enable-grype-sbom:
        description: Anchore Grype vuln scan of the Syft SBOM via anchore/scan-action
        type: boolean
        default: true
      enable-scancode:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Anchore Syft — generate SPDX + CycloneDX SBOMs for the repository
  sbom-anchore-syft:
    name: sbom-anchore-syft
    if: inputs.enable-syft && (inputs.selection-mode == 'all' || inputs.has_generic_code == 'true') && (inputs.scan-scope != 'diff' || inputs.scope_sbom == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
      - name: Anchore Syft SBOM (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: syft.spdx.json
          upload-artifact: false
      - name: Anchore Syft SBOM (CycloneDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: syft.cdx.json
          upload-artifact: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-anchore-syft
          path: |
            syft.spdx.json
            syft.cdx.json

  sbom-trivy:
    name: sbom-trivy
    if: inputs.enable-trivy-sbom && (inputs.selection-mode == 'all' || inputs.has_generic_code == 'true') && (inputs.scan-scope != 'diff' || inputs.scope_sbom == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
      - name: Resolve scankit root
        id: scankit
        uses: virangdoshi/scankit/.github/actions/scankit-root@4e03dad97d9b4418499e9c48e996822e9b7b27b3
      - name: Install Trivy
        run: |
          set -euo pipefail
          VERSION=0.74.0
          curl -sL "https://github.com/aquasecurity/trivy/releases/download/v${VERSION}/trivy_${VERSION}_Linux-64bit.tar.gz" -o trivy.tgz
          bash "${{ steps.scankit.outputs.root }}/scripts/verify-sha256.sh" trivy.tgz 2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a
          tar -xzf trivy.tgz
          sudo install -m 0755 trivy /usr/local/bin/trivy

      - name: Trivy SBOM
        run: |
          trivy fs --format spdx-json --output trivy.spdx.json .
          trivy fs --format cyclonedx --output trivy.cdx.json .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-trivy
          path: |
            trivy.spdx.json
            trivy.cdx.json

  sbom-cdxgen:
    name: sbom-cdxgen
    if: inputs.enable-cdxgen && (inputs.selection-mode == 'all' || inputs.has_generic_code == 'true') && (inputs.scan-scope != 'diff' || inputs.scope_sbom == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
      - name: cdxgen
        run: |
          npx --yes @cyclonedx/cdxgen@11.2.3 -r -o cdxgen.cdx.json || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-cdxgen
          path: cdxgen.cdx.json
          if-no-files-found: warn

  # Anchore Grype — vulnerability scan of the Syft CycloneDX SBOM (+ SARIF to Code Scanning)
  sbom-anchore-grype:
    name: sbom-anchore-grype
    if: inputs.enable-grype-sbom && (inputs.selection-mode == 'all' || inputs.has_generic_code == 'true') && (inputs.scan-scope != 'diff' || inputs.scope_sbom == 'true')
    needs: [sbom-anchore-syft]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom-anchore-syft
          path: sbom
      - name: Anchore Grype (SBOM)
        id: grype
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          sbom: sbom/syft.cdx.json
          fail-build: ${{ inputs.fail-on-severity != 'NONE' }}
          severity-cutoff: ${{ inputs.fail-on-severity == 'NONE' && 'negligible' || inputs.fail-on-severity }}
          output-format: sarif
          add-cpes-if-none: true
      - name: Anchore Grype JSON report
        if: always()
        id: grype-json
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          sbom: sbom/syft.cdx.json
          fail-build: false
          output-format: json
          add-cpes-if-none: true
      - name: Patch SARIF artifactLocation (Grype SBOM scans)
        if: always() && steps.grype.outputs.sarif != ''
        env:
          SARIF_PATH: ${{ steps.grype.outputs.sarif }}
        run: |
          set -euo pipefail
          # Grype SBOM SARIF may omit physicalLocation.uri; Code Scanning rejects that.
          python3 - <<'PY'
          import json, os, pathlib
          path = pathlib.Path(os.environ["SARIF_PATH"])
          data = json.loads(path.read_text())
          stub = "sbom/syft.cdx.json"
          for run in data.get("runs") or []:
              for result in run.get("results") or []:
                  locs = result.get("locations") or []
                  if not locs:
                      result["locations"] = [{
                          "physicalLocation": {"artifactLocation": {"uri": stub}}
                      }]
                      continue
                  for loc in locs:
                      pl = loc.setdefault("physicalLocation", {})
                      art = pl.setdefault("artifactLocation", {})
                      if not art.get("uri"):
                          art["uri"] = stub
          path.write_text(json.dumps(data))
          PY
      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        if: always() && steps.grype.outputs.sarif != ''
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
          category: sbom-anchore-grype
        continue-on-error: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sbom-anchore-grype
          path: |
            ${{ steps.grype.outputs.sarif }}
            ${{ steps.grype-json.outputs.json }}
          if-no-files-found: warn

  sbom-scancode:
    name: sbom-scancode
    if: inputs.enable-scancode && (inputs.selection-mode == 'all' || inputs.has_generic_code == 'true') && (inputs.scan-scope != 'diff' || inputs.scope_sbom == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
      - name: Resolve scankit root
        id: scankit
        uses: virangdoshi/scankit/.github/actions/scankit-root@4e03dad97d9b4418499e9c48e996822e9b7b27b3
      - name: ScanCode
        run: |
          set -euo pipefail
          pip install --require-hashes --only-binary=:all: -r "${{ steps.scankit.outputs.root }}/.github/pinned/scancode-toolkit.txt"
          scancode -clipeu --json-pp scancode.json . || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sbom-scancode-json
          path: scancode.json
          if-no-files-found: warn
