# Scheduled full-tree audit — use with security-minimal on PRs for day-to-day.
name: Security — audit

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: write
  pull-requests: write
  security-events: write
  actions: read
  id-token: write
  packages: read

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    uses: OWNER/scankit/.github/workflows/reusable-security-full.yml@816036eb57bab4feb223f63bb2250f07424c6953
    with:
      profile: audit
      selection-mode: detected
      scan-scope: full
      fail-on-severity: HIGH
      results-publish-mode: none
